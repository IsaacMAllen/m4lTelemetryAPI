# Copy this to group_vars/all.yml and fill in the real values.
# group_vars/ is gitignored.
#
# These vars are consumed by playbook.yml and the templates under templates/.

# --- Domain / TLS -----------------------------------------------------------
api_fqdn: api.yourdomain.com           # public hostname for the API
admin_email: you@yourdomain.com        # used by Caddy/Let's Encrypt for renewal alerts

# How Caddy obtains a TLS certificate.  Two supported values:
#   letsencrypt          - Caddy auto-acquires a public Let's Encrypt cert
#                          via HTTP-01.  Requires Cloudflare proxy OFF
#                          (gray cloud) or no proxy at all.
#   cloudflare_origin_ca - Caddy serves a Cloudflare Origin CA cert that
#                          you generate in the Cloudflare dashboard and
#                          place at /etc/caddy/origin.{crt,key}.  Pair
#                          with Cloudflare SSL/TLS mode "Full (Strict)".
tls_mode: letsencrypt

# When true, restrict UFW so ports 80/443 are reachable ONLY from
# Cloudflare's published IP ranges.  Prevents attackers from bypassing
# the proxy by hitting the origin IP directly.  Refreshed weekly by
# a cron the playbook installs.
lock_to_cloudflare: false

# --- Frontend (CORS) --------------------------------------------------------
# Origins that can call the API from a browser.  Add the bytr Cloudflare
# Pages origin here once you know it.  For preview deploys you may want to
# add the *.pages.dev domain too.
api_cors_origins:
  - https://bytr.yourdomain.com

# --- App image (GHCR) -------------------------------------------------------
api_image: ghcr.io/your-github-user/m4l-telemetry-api
api_image_tag: latest                  # GHA bumps this on every deploy

# --- App runtime ------------------------------------------------------------
api_install_dir: /opt/m4l-telemetry
api_data_volume: m4l-telemetry-pgdata  # named docker volume for postgres
api_workers: 2                         # uvicorn workers per container
api_replicas: 1                        # number of api containers (single-VPS)

# --- Ingest tokens ----------------------------------------------------------
# Comma-separated bearer tokens accepted by POST /v1/events.
# Convention: prefix with the release version so you can retire old tokens
# cleanly.  Generate a new token: openssl rand -hex 24
#
# Rotation workflow:
#   1. Generate a new token: openssl rand -hex 24
#   2. Add it here with the new version prefix (keep the old one briefly
#      so in-flight clients finish flushing -- remove it next release).
#   3. Run: ansible-playbook -i inventory.yml playbook.yml --tags app
#   4. Update bz.telemetry @token in your shipped device to the new value.
#
# Example multi-version window during a release:
#   api_ingest_tokens: "v2_<new>,v1_<old>"  # both accepted, old removed next release
api_ingest_tokens: "v1_REPLACE_WITH_openssl_rand_hex_24"

# --- Backups (Backblaze B2 via restic) --------------------------------------
backup_enabled: true
backup_bucket: m4l-telemetry-backups   # B2 bucket name
backup_retention_daily: 14             # keep 14 daily snapshots
backup_retention_weekly: 4             # keep 4 weekly
backup_retention_monthly: 6            # keep 6 monthly
