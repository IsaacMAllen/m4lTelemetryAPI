# Idempotent playbook for an m4l-telemetry-api host.
#
# Runs as the `deploy` user (created by deploy/scripts/bootstrap-server.sh).
# Re-running this is safe -- every task either does nothing if the system is
# already in the desired state, or it converges toward it.
#
# Usage:
#     cd deploy/ansible
#     ansible-playbook -i inventory.yml playbook.yml --ask-become-pass
#
# Tags:
#     base       - hardening, security, packages
#     docker     - install + enable docker
#     caddy      - install + configure caddy reverse proxy
#     app        - lay down /opt/m4l-telemetry, compose file, env file
#     deploy     - pull image + restart compose stack (run on every deploy)
#     backups    - restic + B2 nightly cron (skipped if backup_enabled is false)
---
- name: Configure m4l-telemetry-api host
  hosts: telemetry
  become: true

  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Verify required vars
      ansible.builtin.assert:
        that:
          - api_fqdn is defined and api_fqdn | length > 0
          - admin_email is defined
          - api_image is defined
          - api_install_dir is defined
        fail_msg: "Fill in deploy/ansible/group_vars/all.yml first."

  tasks:
    # ---------------------------------------------------------------- base ---
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      tags: [base]

    - name: Set timezone to UTC (everything is UTC server-side)
      community.general.timezone:
        name: Etc/UTC
      tags: [base]

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - unattended-upgrades
          - htop
          - rsync
          - jq
          - cron
          - logrotate
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [base]

    - name: Configure unattended-upgrades (security patches only)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
      tags: [base]

    - name: Ensure fail2ban is enabled
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
      tags: [base]

    - name: UFW default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
      tags: [base]

    - name: UFW allow ssh, http, https
      community.general.ufw:
        rule: allow
        name: "{{ item }}"
      loop: [OpenSSH, http, https]
      tags: [base]

    - name: UFW enable
      community.general.ufw:
        state: enabled
      tags: [base]

    # -------------------------------------------------------------- docker ---
    - name: Add Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      tags: [docker]

    - name: Add Docker apt repo
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') | replace('aarch64','arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      tags: [docker]

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      tags: [docker]

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      tags: [docker]

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      tags: [docker]

    # --------------------------------------------------------------- caddy ---
    - name: Add Caddy apt key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy-stable.asc
        mode: "0644"
      tags: [caddy]

    - name: Add Caddy apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: present
      tags: [caddy]

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true
      tags: [caddy]

    - name: Render Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
      notify: reload caddy
      tags: [caddy]

    - name: Enable + start Caddy
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started
      tags: [caddy]

    # ----------------------------------------------------------------- app ---
    - name: Ensure app dir exists
      ansible.builtin.file:
        path: "{{ api_install_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"
      tags: [app]

    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ api_install_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0640"
      notify: restart api stack
      tags: [app]

    # We render `.env` ONLY if it doesn't already exist, so that re-running
    # the playbook never clobbers production secrets.  First-time-only; after
    # that, edit /opt/m4l-telemetry/.env on the box manually (chmod 600).
    - name: Render .env if missing
      ansible.builtin.template:
        src: env.j2
        dest: "{{ api_install_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        force: false
      tags: [app]

    - name: Pull api image
      community.docker.docker_image:
        name: "{{ api_image }}:{{ api_image_tag }}"
        source: pull
      tags: [app, deploy]
      register: pull_result
      failed_when: false   # first time the image may not exist yet; ignore.

    - name: Start / update compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ api_install_dir }}"
        state: present
        pull: missing
      tags: [app, deploy]

    - name: Run database migrations (alembic)
      community.docker.docker_compose_v2:
        project_src: "{{ api_install_dir }}"
        services: [migrate]
        state: present
        recreate: always
      tags: [app, deploy]

    # ------------------------------------------------------------- backups ---
    - name: Install restic
      ansible.builtin.apt:
        name: restic
        state: present
      when: backup_enabled
      tags: [backups]

    - name: Render backup script
      ansible.builtin.template:
        src: backup.sh.j2
        dest: /usr/local/bin/m4l-telemetry-backup
        owner: root
        group: root
        mode: "0750"
      when: backup_enabled
      tags: [backups]

    - name: Schedule nightly backup at 03:17 UTC
      ansible.builtin.cron:
        name: m4l-telemetry nightly backup
        minute: "17"
        hour: "3"
        user: root
        job: /usr/local/bin/m4l-telemetry-backup >> /var/log/m4l-telemetry-backup.log 2>&1
      when: backup_enabled
      tags: [backups]

    - name: Logrotate the backup log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/m4l-telemetry-backup
        mode: "0644"
        content: |
          /var/log/m4l-telemetry-backup.log {
              weekly
              rotate 8
              compress
              missingok
              notifempty
          }
      when: backup_enabled
      tags: [backups]

  handlers:
    - name: reload caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded

    - name: restart api stack
      community.docker.docker_compose_v2:
        project_src: "{{ api_install_dir }}"
        state: present
        recreate: always
