apiVersion: apps/v1
kind: Deployment
metadata:
  name: m4l-telemetry-api
  namespace: telemetry
  labels:
    app.kubernetes.io/name: m4l-telemetry-api
    app.kubernetes.io/component: api
spec:
  # 2 replicas as a baseline -- the HPA scales up from here.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: m4l-telemetry-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m4l-telemetry-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/bugbytz/m4l-telemetry-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ---- DB connection (assembled from CNPG-generated Secret) ------
            # The Secret `m4l-telemetry-pg-app` is created automatically by
            # CloudNativePG when the Cluster bootstraps.  Keys: username,
            # password, host, port, dbname.
            - name: TELEMETRY_DB_HOST
              valueFrom:
                secretKeyRef: { name: m4l-telemetry-pg-app, key: host }
            - name: TELEMETRY_DB_PORT
              valueFrom:
                secretKeyRef: { name: m4l-telemetry-pg-app, key: port }
            - name: TELEMETRY_DB_USER
              valueFrom:
                secretKeyRef: { name: m4l-telemetry-pg-app, key: username }
            - name: TELEMETRY_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: m4l-telemetry-pg-app, key: password }
            - name: TELEMETRY_DB_NAME
              valueFrom:
                secretKeyRef: { name: m4l-telemetry-pg-app, key: dbname }
            # ---- App config ------------------------------------------------
            - name: TELEMETRY_INGEST_TOKENS
              valueFrom:
                secretKeyRef:
                  name: m4l-telemetry-api-tokens
                  key: ingest-tokens
                  optional: true       # local-dev may run without auth
            - name: TELEMETRY_LOG_LEVEL
              value: "INFO"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      terminationGracePeriodSeconds: 30
