# Ingest-token Secret. Don't commit real values. Either:
#
#   kubectl -n telemetry create secret generic m4l-telemetry-api-tokens \
#     --from-literal=ingest-tokens='token-for-livesaver,token-for-other-device'
#
# or wrap it in SealedSecrets / External Secrets for GitOps.
#
# DB credentials are NOT here -- they're generated automatically by
# CloudNativePG into `m4l-telemetry-pg-app`. Don't duplicate them.
apiVersion: v1
kind: Secret
metadata:
  name: m4l-telemetry-api-tokens
  namespace: telemetry
type: Opaque
stringData:
  ingest-tokens: "CHANGE_ME_OR_EMPTY"
