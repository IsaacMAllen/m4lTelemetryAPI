# One-shot Alembic migration. Run before rolling the Deployment so the new
# pods always start against an up-to-date schema.
#
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl -n telemetry wait --for=condition=complete job/m4l-telemetry-migrate --timeout=120s
#
# Re-running this Job after the migration succeeds is safe (it'll just
# observe head and exit 0).  Bump `metadata.name` if you want a fresh Job
# resource in your manifest history.
apiVersion: batch/v1
kind: Job
metadata:
  name: m4l-telemetry-migrate
  namespace: telemetry
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m4l-telemetry-api
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: ghcr.io/bugbytz/m4l-telemetry-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: TELEMETRY_DB_HOST
              valueFrom: { secretKeyRef: { name: m4l-telemetry-pg-app, key: host } }
            - name: TELEMETRY_DB_PORT
              valueFrom: { secretKeyRef: { name: m4l-telemetry-pg-app, key: port } }
            - name: TELEMETRY_DB_USER
              valueFrom: { secretKeyRef: { name: m4l-telemetry-pg-app, key: username } }
            - name: TELEMETRY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: m4l-telemetry-pg-app, key: password } }
            - name: TELEMETRY_DB_NAME
              valueFrom: { secretKeyRef: { name: m4l-telemetry-pg-app, key: dbname } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
