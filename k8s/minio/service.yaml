apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: telemetry
  labels:
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: s3,      port: 9000, targetPort: s3,      protocol: TCP }
    - { name: console, port: 9001, targetPort: console, protocol: TCP }
