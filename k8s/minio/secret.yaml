# MinIO credentials.  These are intentionally weak defaults for the local
# kind cluster.  In production you SHOULD:
#   - rotate them via SealedSecrets / External Secrets
#   - delete this file from the apply set
#
# CNPG and the bucket-init job both read these to authenticate.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: telemetry
type: Opaque
stringData:
  MINIO_ROOT_USER: telemetry-minio-admin
  MINIO_ROOT_PASSWORD: changeme-please-changeme
---
# Same credentials in the format CNPG's barman-cloud expects.
apiVersion: v1
kind: Secret
metadata:
  name: minio-cnpg-credentials
  namespace: telemetry
type: Opaque
stringData:
  ACCESS_KEY_ID: telemetry-minio-admin
  SECRET_ACCESS_KEY: changeme-please-changeme
